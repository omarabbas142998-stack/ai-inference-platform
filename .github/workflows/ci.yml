name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-inference-api ./app

      - name: Run container and test health endpoint
        run: |
          docker run -d -p 8000:8000 --name ci-test ai-inference-api
          sleep 15
          curl --fail http://localhost:8000/health
          docker stop ci-test

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ai-inference-api:latest ./app
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ai-inference-api:latest

      - name: Deploy to Kubernetes via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo k3s kubectl rollout restart deployment ai-inference-deployment
            sudo k3s kubectl rollout status deployment ai-inference-deployment --timeout=120s
